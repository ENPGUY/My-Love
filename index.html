<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>실라에게 전하는 한마디</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff0f5, #fffaf0);
}

.card {
    width: 85%;
    max-width: 500px;
    padding: 40px;
    background: white;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

h1 {
    margin-bottom: 30px;
}

#message {
    min-height: 100px;
    font-size: 20px;
    line-height: 1.8;
}

button {
    margin-top: 25px;
    padding: 15px 25px;
    border: none;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="card">

    <h1>🌷 러블리한 실라</h1>

    <div id="message">
        버튼을 눌러보세요.
    </div>

    <button onclick="showLove()">
        💌 사랑의 마음 전하기
    </button>

</div>

<script>
const messages = [
    "실라 참 아름다워. 웃는 모습은 더 아름다워.",
    "실라 처음에는 아름다운 모습이 눈에 들어왔는데, 알아갈수록 마음이 더 아름답다고 생각해.",
    "실라와 함께 같이 걷고 이야기하는 평범한 시간이 요즘은 특별하게 느껴져.",
    "실라처럼 매일매일 보고 싶어지는 사람은 흔하지 않아 >.<.",
    "실라와 함께 있을 때 너무나도 행복하고 감사해.",
    "실라는 너무 러블리해.",
    "실라를 만나고 나서 평범했던 하루에 기다려지는 시간이 생겼어.",
    "Ultimate Ture Results: 실라는 아름답다. 그리고 내일 다시 계산해도 결과는 같을 예정입니다.",
    "if (silla.smile) { myDay = 'happy'; }",
    "while (true) { love++; }",
    "실라의 아름다움을 계산하는 중... 오류: 측정 범위를 초과했습니다, 측정할 수 없는 아름다움.",
    "System.out.println('오늘도 실라가 보고 싶습니다.');"
];

let previous = -1;

function showLove() {

    let random;

    do {
        random = Math.floor(Math.random() * messages.length);
    } while (random === previous);

    previous = random;

    document.getElementById("message").innerText = messages[random];
}

function showLove() {

    const random =
        Math.floor(Math.random() * messages.length);

    document.getElementById("message").innerText =
        messages[random];
}

</script>

</body>
</html>
